# aiprice.monkeykgai.com 缓存策略
#
# 用法：1Panel → 网站 → aiprice.monkeykgai.com → 配置文件，
# 把下面 BEGIN/END 之间的内容粘到 server { } 里面（放在 root 那一行后面），保存。
#
# ⚠️ nginx 的 add_header 有个坑：只要 location 里出现了任何 add_header，
#    server 层的 add_header 就**全部不再继承**。原配置在 server 层有一条
#    Strict-Transport-Security，所以下面每个 location 都得把它重新加一遍，
#    否则这些路径的 HSTS 头会凭空消失。
#
# 缓存分层：
#   /_astro/*  构建产物，文件名带内容哈希，改了就换名 → 永久缓存
#   静态资源    字体/图片 → 30 天
#   HTML       价格每天变一次 → 浏览器每次校验，Cloudflare 边缘存 1 小时
#
# max-age=0 + s-maxage=3600 的含义：浏览器不留副本（每次回 CDN 校验），
# 但 Cloudflare 边缘可以缓存 1 小时。这样每日重建后最多 1 小时就全球生效，
# 又不至于让用户浏览器拿着过期价格。

# ==== AIPRICE CACHE BEGIN ====
location ^~ /_astro/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

location ~* \.(woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|ico|svg)$ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}

location ~* \.json$ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400" always;
}

location / {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400" always;
    # $uri.html 必须排在 $uri/ 前面。构建产物里 /zh.html 和 /zh/ 目录同时存在
    # （后者装着 r/、p/ 子页），若先匹配 $uri/，nginx 会把 /zh 当目录 301 到 /zh/，
    # 而那里没有 index.html —— 首页就打不开了。
    # 结尾用 =404 而不是 /404.html：后者会用 200 状态码返回 404 页面，
    # 也就是 soft 404，搜索引擎会把这些页面当正常页收录。
    try_files $uri $uri.html $uri/ =404;
}
# ==== AIPRICE CACHE END ====
