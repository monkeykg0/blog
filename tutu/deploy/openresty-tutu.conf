# 兔兔听书屋 · 追加到 conf.d/monkeykgai.com.conf 的 server{} 内
# (setup-nginx.sh 自动注入,此文件仅作参考)
# 容器内路径:宿主 /opt/1panel/apps/openresty/openresty/www == 容器 /www

# ==== TUTU BEGIN ====
location /api/media/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "no-store";
}

location /tutu/ {
    alias /www/media/web/;
    index index.html;
    try_files $uri $uri/ /tutu/index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /tutu/files/ {
    alias /www/media/library/;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # 音频不可变,放心缓存一周
    add_header Cache-Control "public, max-age=604800";
}
# ==== TUTU END ====
